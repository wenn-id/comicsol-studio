[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "comicsol-studio"
dynamic = ["version"]
description = "A full-stack creator application built directly on the Comic Sol engine"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Alwan Juliawan" }]
dependencies = [
    "comic-sol @ git+https://github.com/wenn-id/comicsol@7c0138df6030c4c4105533d05ed43affb33bad2d",
    "anthropic==1.12.1",
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "pillow==12.3.0",
    "python-multipart==0.0.32",
    "starlette==1.6.0",
    "uvicorn==0.35.0",
]

[project.scripts]
comicsol-studio = "comicsol_studio.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "comicsol_studio.__version__" }

[tool.setuptools.packages.find]
include = ["comicsol_studio*"]

[tool.setuptools.package-data]
comicsol_studio = [
    "web/*.html",
    "web/assets/css/*.css",
    "web/assets/js/*.js",
    "web/assets/js/*/*.js",
    "web/assets/vendor/*.js",
    "web/assets/vendor/*.txt",
    "web/assets/fonts/*.woff2",
    "web/assets/fonts/*.ttf",
    "web/assets/fonts/*.txt",
    "web/assets/img/*.svg",
    "web/assets/img/*.webp",
]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
