[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "comicsol-studio"
dynamic = ["version"]
description = "A creator-first Comic Sol Studio interface served on top of the comic-sol-web API"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Alwan Juliawan" }]
dependencies = [
    "comic-sol-web==0.1.0",
]

[project.scripts]
comicsol-studio = "comicsol_studio.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "comicsol_studio.__version__" }

[tool.setuptools.packages.find]
include = ["comicsol_studio*"]

[tool.setuptools.package-data]
comicsol_studio = [
    "ui/index.html",
    "ui/css/*.css",
    "ui/js/*.js",
    "ui/js/views/*.js",
    "ui/fonts/Archivo-Variable.ttf",
    "ui/fonts/OFL-Archivo.txt",
    "ui/fonts/ComicNeue-Bold.ttf",
    "ui/fonts/OFL-ComicNeue.txt",
]
