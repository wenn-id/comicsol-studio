name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Studio and the pinned engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip install ruff==0.16.3
          python -m pip check
      - name: Studio has no comic-sol-web dependency
        run: python -c "import importlib.util as u, sys; sys.exit(u.find_spec('comic_sol_web') is not None)"
      - name: Lint
        run: python -m ruff check comicsol_studio tests
      - name: Test
        run: python -m unittest discover -s tests -p "test_*.py" -v
